    <!-- GitHub Pages SPA Redirect Restoration -->
    <script>
      (function (l) {
        if (l.search && l.search.indexOf('?/') === 0) {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          var cleanRoute = decoded.replace(/^\//, '').split('?')[0];
          if (cleanRoute) {
            window.history.replaceState(null, '', l.pathname.replace(/\/$/, '') + '/#' + cleanRoute);
          }
        }
      })(window.location);
    </script>
